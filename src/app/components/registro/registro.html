<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card bg-dark border-secondary shadow-lg">
        <div class="card-body p-4">

          <h2 class="text-center mb-4 text-light">Crear cuenta</h2>

          <form class="text-light">

            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control bg-black text-light border-secondary">
            </div>

            <div class="mb-3">
              <label class="form-label">Apellido</label>
              <input type="text" class="form-control bg-black text-light border-secondary">
            </div>

            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control bg-black text-light border-secondary">
            </div>

            <div class="mb-3">
              <label class="form-label">Nombre de usuario</label>
              <div class="input-group">
                <span class="input-group-text bg-black text-secondary border-secondary">@</span>
                <input type="text" class="form-control bg-black text-light border-secondary">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control bg-black text-light border-secondary">
            </div>

            <div class="mb-3">
              <label class="form-label">Repetir contraseña</label>
              <input type="password" class="form-control bg-black text-light border-secondary">
            </div>

            <div class="mb-3">
              <label class="form-label">Fecha de nacimiento</label>
              <input type="date" class="form-control bg-black text-light border-secondary">
            </div>

            <div class="mb-3">
              <label class="form-label">Biografía</label>
              <textarea
                rows="4"
                maxlength="160"
                class="form-control bg-black text-light border-secondary"
                placeholder="Contanos algo sobre vos...">
              </textarea>
            </div>

            <div class="mb-4">
              <label class="form-label">Foto de perfil</label>
              <input
                type="file"
                accept="image/*"
                class="form-control bg-black text-light border-secondary">
            </div>

            <button class="btn btn-primary w-100 rounded-pill">
              Registrarse
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
